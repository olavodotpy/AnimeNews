<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Crunchyroll RSS</title>
    <link rel="stylesheet" href="/static/layouts/nav.css">
    <link rel="stylesheet" href="/static/layouts/cards.css">
    <link rel="stylesheet" href="/static/layouts/footer.css">
    <link rel="shortcut icon" href="/static/assets/images/favicon.ico" type="image/x-icon">
</head>

<body>
    <header>
        <div class="header-nav">
            <div class="nav-logo">
                <a href="/">
                    <img src="/static/assets/images/crunchyLogoRSS.png" alt=""> 
                </a>
            </div>
            <div class="nav-button">
                <div class="login">
                    <a href="#">
                        <button>Login</button>
                    </a>
                </div>
                <div class="lightmode">
                    <button id="lightmode">
                        <img src="/static/assets/images/brightness_dark.png" id="imgMode" alt="lightmode">
                    </button>
                </div>
            </div>
        </div>
    </header>

    <nav>
        {% for post in posts %}
        <div class="blog_wrap">
            <div class="blog_item">
                <a href="/post/{{ post.id }}" class="thumb">
                    <img src="{{ post.media }}" alt="media">
                </a>
                <div class="blog_info">
                    <h2><a href="/post/{{ post.id }}">{{ post.title }}</a></h2>
                    <h3>{{ post.description }}</h3>
                </div>
            </div>
        </div>
        {% endfor %}
    </nav>

    <footer>
        <div class="creator">
            <p class="text_color">created by olavodotpy</p>
        </div>
        <div class="src">
            <a href="https://github.com/olavodotpy/Crunchyroll-RSS">Source code/credits</a>
        </div>
    </footer>

</body>

    <script src="/static/scripts/lightMode.js"></script>
</html>
