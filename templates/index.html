<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Notícias Animes & Mangas</title>
    <link rel="stylesheet" href="/static/style/buttonHome.css">
    <link rel="stylesheet" href="/static/style/lightMode.css">
    <link rel="stylesheet" href="/static/style/cards.css">
    <link rel="stylesheet" href="/static/style/style.css">
    <link rel="shortcut icon" href="/static/image/favicon.ico" type="image/x-icon">
  </head>
  <body>

    <header>
      <div class="div_button_home" style="overflow: hidden;">
        <button onclick="window.location.href='/'" class="button_home">
          <p class="text_color">Útimas Notícias</p>
        </button>
      </div>

      <div class="div_lightmode">
        <button id="lightmode" class="button_lightmode">
          <img src="/static/image/light-mode.png" alt="lightmode">
        </button>
      </div>
    </header>

    <nav>
      {% for post in posts %}
      <div class="blog_wrap">
        <div class="blog_item">
          <a href="/post/{{ post.id }}" class="thumb"><img src="{{ post.media }}" alt="media"></a>
          <div class="blog_info">
            <h2><a href="/post/{{ post.id }}">{{ post.title }}</a></h2>
            <h3>{{ post.description }}</h3>
          </div>
        </div>
      </div>
      {% endfor %}
    </nav>

    <script src="/static/js/lightMode.js"></script>
  </body>
</html>
