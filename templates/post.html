<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="/static/css/buttonHome.css">
    <link rel="stylesheet" href="/static/css/lightMode.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/content.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="shortcut icon" href="/static/image/favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <div class="color_bar" style="overflow: hidden;">
            <button onclick="window.location.href='/'" class="button_home">
                <p class="text_color">Anime News</p>
            </button>

            <div class="div_lightmode">
                <button id="lightmode" class="button_lightmode">
                    <img src="/static/image/light-mode.png" alt="lightmode">
                </button>
            </div>
        </div>
    </header>

    <main class="post_content">
        <h1>{{ post.title }}</h1>
        <h2>{{ post.description }}</h2>
        <img src="{{ post.media }}" alt="media">
        {% for paragraph in post.content %}
        <p class="text_color">{{ paragraph|safe }}</p>
        {% endfor %}
    </main>

    <footer>
        <div class="footer">
            <div class="authors">
                <p class="text_color">Written by</p>
                <p class="text_color">{{ post.author }}</p>
            </div>
            <div class="src">
                <a href="https://github.com/olavodotpy/AnimeNews/tree/Master">Source code</a>
            </div>
        </div>
    </footer>

    <script src="/static/js/lightMode.js"></script>
</body>
</html>
