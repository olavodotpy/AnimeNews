<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/content.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="shortcut icon" href="/static/image/favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
            <div class="header-nav">
                <div class="nav-logo">
                    <button onclick="window.location.href='/'">
                        <img src="/static/image/crunchyLogoRSS.png" alt=""> 
                    </button>
                </div>
                <div class="nav-button">
                    <div class="login">
                        <button window.location.href='#'>Login</button>
                    </div>
                    <div class="lightmode">
                        <button id="lightmode">
                            <img src="/static/image/brightness_dark.png" id="imgMode" alt="lightmode">
                        </button>
                    </div>
                </div>
            </div>
    </header>

    <main class="post_content">
        <h1>{{ post.title }}</h1>
        <h2>{{ post.description }}</h2>
        <img src="{{ post.media }}" alt="media">
        {% if post.content is string() %}
            <p class="text_color"> {{ post.content|safe }} </p>
        {% else %}
            {% for paragraph in post.content %}
                <p class="text_color">{{ paragraph|safe }}</p>
            {% endfor %}
        {%endif%}
    </main>

    <footer>
        <div class="authors">
            <p class="text_color">Written by {{ post.author }}</p>
        </div>
        <div class="creator">
            <p class="text_color">created by olavodotpy</p>
        </div>
        <div class="src">
            <a href="https://github.com/olavodotpy/AnimeNews/tree/Master">Source code/credits</a>
        </div>
    </footer>

    <script src="/static/js/lightMode.js"></script>
</body>
</html>
